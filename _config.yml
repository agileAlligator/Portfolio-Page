title: Avneesh Kasture
tagline: Associate Solutions Engineer at Gruve
description: >-
  Building secure MCP servers for clients — hardening the agentic layer against
  prompt injection, tool misuse, and privilege abuse. Field notes on MCP
  security, agentic safety, and shipping AI platforms.
url: "https://avneeshk.me"
lang: en

author:
  name: Avneesh Kasture
  email: apkasture02@gmail.com

# Stable, dateless blog URLs (e.g. /blog/stdout-is-not-yours/).
# Individual posts may override this with a shorter slug in their front matter.
permalink: /blog/:title/

# Social / SEO (consumed by jekyll-seo-tag)
# Site-default share card is applied via `defaults` below (jekyll-seo-tag reads
# `page.image`, not a top-level `site.image`, so a bare key here would be ignored).
twitter:
  card: summary_large_image
social:
  name: Avneesh Kasture
  links:
    - https://github.com/agileAlligator
    - https://www.linkedin.com/in/avneesh-kasture-491b651b6/

# GitHub Pages builds these natively — no Actions, no Gemfile needed.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml
  # One Atom feed per tag at /feed/by_tag/<tag>.xml. jekyll-feed 0.17 skips
  # any tag containing a hyphen, so those tags get no feed.
  tags: {}

# ── Keep non-page assets OUT of sitemap.xml ─────────────────────────────────
# The sitemap should list indexable *content pages* only (home, /blog, posts).
# The entries below are downloadable/one-off files — PDFs and a standalone HTML
# toy — not pages we want Google to index or crawl as part of the site's page
# inventory. jekyll-sitemap honours `sitemap: false`; static files (no front
# matter of their own) get it via these path-scoped defaults.
# 👉 If you add another PDF or standalone asset, add a matching entry here or it
#    will silently reappear in the sitemap.
defaults:
  # Site-default share card. Any page/post that sets its own `image:` in front
  # matter overrides this (page-level values win over defaults), so every shared
  # link — including /blog/ — renders a card.
  - scope: { path: "" }
    values:
      image: /assets/og/default.png
  # Blog posts are articles — tell jekyll-seo-tag to emit BlogPosting JSON-LD
  # (headline, datePublished/Modified, author, image, publisher) from front matter.
  - scope: { path: "", type: posts }
    values:
      seo:
        type: BlogPosting
  - scope: { path: "resume.pdf" }
    values: { sitemap: false }
  - scope: { path: "research-draft2024.pdf" }
    values: { sitemap: false }
  - scope: { path: "seinfeld-rolodex.html" }
    values: { sitemap: false }
  # JSON read server-side by the MCP Worker (mcp-worker/), not pages.
  - scope: { path: "api" }
    values: { sitemap: false }

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Stylesheets are authored as .scss (with `---` front matter) so jekyll-sass-converter
# minifies them on build. GitHub Pages ships this natively — source keeps its comments,
# the served .css is compressed.
sass:
  style: compressed

# Jekyll skips dot-directories; publish security.txt (RFC 9116).
include:
  - ".well-known"

# Don't process/publish these
exclude:
  - "*.skill"
  - "*.log"
  - scripts
  - dns-records-avneeshk.me.txt
  - README.md
  - DESIGN-SYSTEM.md
  - .claude
  - Gemfile
  - Gemfile.lock
  - vendor
  - mcp-worker
