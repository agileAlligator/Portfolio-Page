<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 774" role="img" aria-labelledby="t d">
  <title id="t">How SalesBleed moved CRM data from a web form to the attacker</title>
  <desc id="d">Flowchart in numbered steps. 1: a stranger submits a public Web-to-Lead form, with no login and no click. 2: it becomes a lead record in the CRM, which runs again every time it is read; which field carried the payload is not disclosed. 3: an employee later asks the agent something routine, such as check my latest leads. The employee's question, the system prompt and the stranger's lead text all land in the agent's context window as one token stream; role markers are more tokens, not a wall. 4: the model follows the injected text. 5: Query Records reads Accounts with permissions it already had. 6: the agent writes a link with company names and deal sizes in the hostname. 7: the URL redactor must recognize a URL before blocking it; it misses the .fun top-level domain and skips curly braces and square brackets that the renderer still links. 8: the chat loads the result as an image, or Slack's preview fetches it, with no click. 9: the DNS lookup for a hostname like Acme-712412.sub.oast.fun carries the data. 10: it reaches the attacker's name server. Dark Reading reports that the bypassed redactor is the URL filtering Salesforce added after ForcedLeak in 2025; Salesforce has published no advisory saying so.</desc>
  <style>
    .bg { fill: #f7f7f4; }
    .box { fill: #f7f7f4; stroke: #1a1a1e; stroke-width: 1.5; }
    .strip { fill: #f7f7f4; stroke: #d9d9d3; stroke-width: 1.5; }
    .inject { fill: #f7f7f4; stroke: #c8372d; stroke-width: 2; }
    .check { fill: #f7f7f4; stroke: #2340a0; stroke-width: 2; }
    .zone { fill: none; stroke: #55565c; stroke-width: 1.5; }
    .unknown { fill: none; stroke: #55565c; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .label { font-family: "Schibsted Grotesk", sans-serif; font-size: 15px; font-weight: 600; fill: #1a1a1e; }
    .sm { font-size: 14px; }
    .soft { font-family: "Schibsted Grotesk", sans-serif; font-size: 12.5px; fill: #55565c; }
    .note { font-family: "Schibsted Grotesk", sans-serif; font-size: 12.5px; font-style: italic; fill: #55565c; }
    .code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; fill: #2340a0; }
    .red { font-family: "Schibsted Grotesk", sans-serif; font-size: 12.5px; font-weight: 600; fill: #c8372d; }
    .arrow { stroke: #1a1a1e; stroke-width: 1.5; fill: none; }
    .head { fill: #1a1a1e; }
    .num { fill: #1a1a1e; }
    .numt { font-family: "Schibsted Grotesk", sans-serif; font-size: 12px; font-weight: 700; fill: #f7f7f4; }
    @media (prefers-color-scheme: dark) {
      .bg, .box, .strip, .inject, .check { fill: #16171a; }
      .box { stroke: #e8e8e3; }
      .strip { stroke: #34353a; }
      .inject { stroke: #ff6b5e; }
      .check { stroke: #8aa2ff; }
      .zone, .unknown { stroke: #a3a4a9; }
      .label { fill: #e8e8e3; }
      .soft, .note { fill: #a3a4a9; }
      .code { fill: #8aa2ff; }
      .red { fill: #ff6b5e; }
      .arrow { stroke: #e8e8e3; }
      .head, .num { fill: #e8e8e3; }
      .numt { fill: #16171a; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="774"/>
  <rect class="inject" x="24" y="20" width="308" height="62" rx="6"/>
  <text class="label" x="42" y="46">Stranger submits a web form</text>
  <text class="soft" x="42" y="66">public Web-to-Lead; no login, no click</text>
  <circle class="num" cx="24" cy="20" r="11"/><text class="numt" x="24" y="24.5" text-anchor="middle">1</text>
  <rect class="box" x="388" y="20" width="308" height="82" rx="6"/>
  <text class="label" x="406" y="46">Lead record sits in the CRM</text>
  <text class="soft" x="406" y="66">runs again every time it's read</text>
  <text class="note" x="406" y="85">which field carried it: not disclosed</text>
  <circle class="num" cx="388" cy="20" r="11"/><text class="numt" x="388" y="24.5" text-anchor="middle">2</text>
  <line class="arrow" x1="332" y1="51" x2="385" y2="51" marker-end="url(#ah)"/>
  <rect class="box" x="24" y="130" width="308" height="62" rx="6"/>
  <text class="label" x="42" y="156">Employee asks the agent</text>
  <text class="code" x="42" y="176">“check my latest leads…”</text>
  <circle class="num" cx="24" cy="130" r="11"/><text class="numt" x="24" y="134.5" text-anchor="middle">3</text>
  <rect class="zone" x="24" y="226" width="672" height="118" rx="8"/>
  <text class="label" x="42" y="310">Agent's context window: one token stream</text>
  <text class="note" x="42" y="329">Role markers are more tokens, not a wall</text>
  <rect class="strip" x="40.0" y="242" width="205.33333333333334" height="44" rx="5"/>
  <text class="label sm" x="52.0" y="269">Employee's question</text>
  <rect class="strip" x="257.33333333333337" y="242" width="205.33333333333334" height="44" rx="5"/>
  <text class="label sm" x="269.33333333333337" y="269">System prompt</text>
  <rect class="inject" x="474.6666666666667" y="242" width="205.33333333333334" height="44" rx="5"/>
  <text class="label sm" x="486.6666666666667" y="262">Lead text</text>
  <text class="soft" x="486.6666666666667" y="279">as the stranger typed it</text>
  <line class="arrow" x1="178.0" y1="192" x2="178.0" y2="239" marker-end="url(#ah)"/>
  <line class="arrow" x1="542.0" y1="102" x2="542.0" y2="130" marker-end="url(#ah)"/>
  <line class="arrow" x1="542.0" y1="130" x2="542.0" y2="239" marker-end="url(#ah)"/>
  <rect class="box" x="24" y="378" width="308" height="62" rx="6"/>
  <text class="label" x="42" y="404">Model follows the injected text</text>
  <text class="soft" x="42" y="424">instruction-shaped text gets carried out</text>
  <circle class="num" cx="24" cy="378" r="11"/><text class="numt" x="24" y="382.5" text-anchor="middle">4</text>
  <rect class="box" x="388" y="378" width="308" height="62" rx="6"/>
  <text class="label" x="406" y="404">Query Records reads Accounts</text>
  <text class="soft" x="406" y="424">the permissions were already there</text>
  <circle class="num" cx="388" cy="378" r="11"/><text class="numt" x="388" y="382.5" text-anchor="middle">5</text>
  <line class="arrow" x1="178.0" y1="344" x2="178.0" y2="375" marker-end="url(#ah)"/>
  <line class="arrow" x1="332" y1="409" x2="385" y2="409" marker-end="url(#ah)"/>
  <rect class="box" x="388" y="470" width="308" height="62" rx="6"/>
  <text class="label" x="406" y="496">Agent writes a link</text>
  <text class="soft" x="406" y="516">names and deal sizes in the hostname</text>
  <circle class="num" cx="388" cy="470" r="11"/><text class="numt" x="388" y="474.5" text-anchor="middle">6</text>
  <rect class="check" x="24" y="470" width="308" height="100" rx="6"/>
  <text class="label" x="42" y="496">URL redactor (Trusted URLs)</text>
  <text class="soft" x="42" y="516">must recognize a URL before blocking it</text>
  <text class="red" x="42" y="535">misses .fun: not in its fixed TLD list</text>
  <text class="red" x="42" y="554">skips { } [ ], which the renderer links</text>
  <circle class="num" cx="24" cy="470" r="11"/><text class="numt" x="24" y="474.5" text-anchor="middle">7</text>
  <line class="arrow" x1="542.0" y1="440" x2="542.0" y2="467" marker-end="url(#ah)"/>
  <line class="arrow" x1="388" y1="501" x2="335" y2="501" marker-end="url(#ah)"/>
  <rect class="box" x="24" y="600" width="308" height="62" rx="6"/>
  <text class="label" x="42" y="626">Chat loads it as an image</text>
  <text class="soft" x="42" y="646">or Slack's preview fetches it; no click</text>
  <circle class="num" cx="24" cy="600" r="11"/><text class="numt" x="24" y="604.5" text-anchor="middle">8</text>
  <rect class="box" x="388" y="600" width="308" height="62" rx="6"/>
  <text class="label" x="406" y="626">DNS lookup carries the data</text>
  <text class="code" x="406" y="646">Acme-712412.&lt;sub&gt;.oast.fun</text>
  <circle class="num" cx="388" cy="600" r="11"/><text class="numt" x="388" y="604.5" text-anchor="middle">9</text>
  <line class="arrow" x1="178.0" y1="570" x2="178.0" y2="597" marker-end="url(#ah)"/>
  <line class="arrow" x1="332" y1="631" x2="385" y2="631" marker-end="url(#ah)"/>
  <rect class="inject" x="388" y="692" width="308" height="62" rx="6"/>
  <text class="label" x="406" y="718">Attacker's name server</text>
  <text class="soft" x="406" y="738">the HTTP request after it is irrelevant</text>
  <circle class="num" cx="388" cy="692" r="11"/><text class="numt" x="388" y="696.5" text-anchor="middle">10</text>
  <line class="arrow" x1="542.0" y1="662" x2="542.0" y2="689" marker-end="url(#ah)"/>
  <rect class="unknown" x="24" y="692" width="308" height="62" rx="6"/>
  <text class="label" x="42" y="718">Is 7 the 2025 ForcedLeak fix?</text>
  <text class="note" x="42" y="738">Dark Reading reports so; no advisory</text>
</svg>
