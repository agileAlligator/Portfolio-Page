<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" role="img" aria-labelledby="t d">
  <title id="t">How SalesBleed moved CRM data from a web form to the attacker</title>
  <desc id="d">A stranger submits a public Web-to-Lead form, which becomes a lead record in the CRM; which field carried the payload is not disclosed. Later an employee asks the agent about leads. The vendor system prompt, the employee's question and the Query Records result with the lead fields as typed all enter the agent's context window as one token stream. The model follows the injected text, Query Records reads Accounts with permissions it already had, and the agent writes a link with company names and deal sizes in the hostname. The URL redactor has to recognize a URL before blocking it: it misses the .fun top-level domain and skips curly braces and square brackets that the renderer still treats as part of a link. The chat surface loads the result as an image, or Slack's link preview fetches it, with no click. The DNS lookup for a hostname like Acme-712412.sub.oast.fun carries the data to the attacker's name server. Whether this redactor is the same code as the 2025 ForcedLeak fix is inferred from the timeline and not disclosed.</desc>
  <style>
    .bg { fill: #f7f7f4; }
    .box { fill: #f7f7f4; stroke: #1a1a1e; stroke-width: 1.5; }
    .strip { fill: #f7f7f4; stroke: #d9d9d3; stroke-width: 1.5; }
    .inject { fill: #f7f7f4; stroke: #c8372d; stroke-width: 2; }
    .check { fill: #f7f7f4; stroke: #2340a0; stroke-width: 2; }
    .zone { fill: none; stroke: #55565c; stroke-width: 1.5; }
    .unknown { fill: none; stroke: #55565c; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .label { font-family: "Schibsted Grotesk", sans-serif; font-size: 15px; font-weight: 600; fill: #1a1a1e; }
    .soft { font-family: "Schibsted Grotesk", sans-serif; font-size: 12.5px; fill: #55565c; }
    .note { font-family: "Schibsted Grotesk", sans-serif; font-size: 12.5px; font-style: italic; fill: #55565c; }
    .zonelabel { font-family: "Schibsted Grotesk", sans-serif; font-size: 13px; font-weight: 600; fill: #55565c; letter-spacing: 0.03em; }
    .code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; fill: #2340a0; }
    .red { font-family: "Schibsted Grotesk", sans-serif; font-size: 12.5px; font-weight: 600; fill: #c8372d; }
    .arrow { stroke: #1a1a1e; stroke-width: 1.5; fill: none; }
    .dasharrow { stroke: #55565c; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .head { fill: #1a1a1e; }
    .softhead { fill: #55565c; }
    @media (prefers-color-scheme: dark) {
      .bg, .box, .strip, .inject, .check { fill: #16171a; }
      .box { stroke: #e8e8e3; }
      .strip { stroke: #34353a; }
      .check { stroke: #8aa2ff; }
      .zone, .unknown { stroke: #a3a4a9; }
      .label { fill: #e8e8e3; }
      .soft, .note, .zonelabel { fill: #a3a4a9; }
      .code { fill: #8aa2ff; }
      .arrow { stroke: #e8e8e3; }
      .dasharrow { stroke: #a3a4a9; }
      .head { fill: #e8e8e3; }
      .softhead { fill: #a3a4a9; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="softhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="750"/>

  <!-- Context window -->
  <text class="zonelabel" x="20" y="28">Agent's context window: one token stream</text>
  <rect class="zone" x="20" y="40" width="320" height="220" rx="8"/>

  <rect class="strip" x="36" y="56" width="288" height="50" rx="5"/>
  <text class="label" x="52" y="86">Vendor system prompt</text>

  <rect class="strip" x="36" y="116" width="288" height="50" rx="5"/>
  <text class="label" x="52" y="137">Employee's question</text>
  <text class="code" x="52" y="156">"check my latest leads…"</text>

  <rect class="inject" x="36" y="176" width="288" height="50" rx="5"/>
  <text class="label" x="52" y="197">Query Records result</text>
  <text class="soft" x="52" y="216">lead fields, as typed by a stranger</text>

  <text class="note" x="36" y="248">Role markers are more tokens, not a wall</text>

  <!-- Inputs on the right -->
  <rect class="box" x="400" y="116" width="300" height="50" rx="6"/>
  <text class="label" x="416" y="137">Employee asks the agent</text>
  <text class="soft" x="416" y="156">something routine, much later</text>
  <line class="arrow" x1="400" y1="141" x2="326" y2="141" marker-end="url(#ah)"/>

  <rect class="box" x="400" y="176" width="300" height="50" rx="6"/>
  <text class="label" x="416" y="197">Lead record in the CRM</text>
  <text class="soft" x="416" y="216">stays put; runs again on every read</text>
  <line class="arrow" x1="400" y1="201" x2="326" y2="201" marker-end="url(#ah)"/>

  <rect class="box" x="400" y="276" width="300" height="56" rx="6"/>
  <text class="label" x="416" y="299">Stranger submits a web form</text>
  <text class="soft" x="416" y="319">public Web-to-Lead; no login, no click</text>
  <line class="dasharrow" x1="430" y1="276" x2="430" y2="229" marker-end="url(#ahs)"/>
  <text class="note" x="442" y="257">which field carried it: not disclosed</text>

  <!-- Model acts -->
  <line class="arrow" x1="180" y1="260" x2="180" y2="347" marker-end="url(#ah)"/>
  <rect class="box" x="20" y="350" width="320" height="60" rx="6"/>
  <text class="label" x="36" y="375">Model follows the injected text</text>
  <text class="soft" x="36" y="396">instruction-shaped text gets carried out</text>

  <line class="arrow" x1="340" y1="380" x2="397" y2="380" marker-end="url(#ah)"/>
  <rect class="box" x="400" y="350" width="300" height="60" rx="6"/>
  <text class="label" x="416" y="375">Query Records reads Accounts</text>
  <text class="soft" x="416" y="396">the permissions were already there</text>

  <line class="arrow" x1="550" y1="410" x2="550" y2="437" marker-end="url(#ah)"/>
  <rect class="box" x="400" y="440" width="300" height="60" rx="6"/>
  <text class="label" x="416" y="465">Agent writes a link</text>
  <text class="soft" x="416" y="486">names and deal sizes in the hostname</text>

  <!-- Redactor -->
  <line class="arrow" x1="400" y1="470" x2="343" y2="470" marker-end="url(#ah)"/>
  <rect class="check" x="20" y="440" width="320" height="104" rx="6"/>
  <text class="label" x="36" y="465">URL redactor (Trusted URLs)</text>
  <text class="soft" x="36" y="485">must recognize a URL before blocking it</text>
  <text class="red" x="36" y="509">Misses .fun: not in its fixed TLD list</text>
  <text class="red" x="36" y="530">Skips { } [ ], which the renderer links</text>

  <!-- Fetch -->
  <line class="arrow" x1="180" y1="544" x2="180" y2="581" marker-end="url(#ah)"/>
  <rect class="box" x="20" y="584" width="320" height="60" rx="6"/>
  <text class="label" x="36" y="609">Chat loads it as an image</text>
  <text class="soft" x="36" y="630">or Slack's preview fetches it; no click</text>

  <line class="arrow" x1="340" y1="614" x2="397" y2="614" marker-end="url(#ah)"/>
  <rect class="box" x="400" y="584" width="300" height="60" rx="6"/>
  <text class="label" x="416" y="609">DNS lookup carries the data</text>
  <text class="code" x="416" y="630">Acme-712412.&lt;sub&gt;.oast.fun</text>

  <line class="arrow" x1="550" y1="644" x2="550" y2="671" marker-end="url(#ah)"/>
  <rect class="inject" x="400" y="674" width="300" height="56" rx="6"/>
  <text class="label" x="416" y="697">Attacker's name server</text>
  <text class="soft" x="416" y="717">the HTTP request after is irrelevant</text>

  <!-- Inferred link to ForcedLeak -->
  <rect class="unknown" x="20" y="674" width="320" height="56" rx="6"/>
  <text class="label" x="36" y="697">Redactor = 2025 ForcedLeak fix?</text>
  <text class="note" x="36" y="717">inferred from the timeline; not disclosed</text>
</svg>
