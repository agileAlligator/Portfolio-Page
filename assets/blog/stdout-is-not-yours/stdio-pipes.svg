<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
  <title id="t">Who reads which pipe in a stdio MCP server</title>
  <desc id="d">The MCP client writes JSON-RPC requests to the server's stdin and parses every line on the server's stdout as JSON-RPC. A valid response frame on stdout is accepted. A structlog line on stdout, with keys event and level, is rejected by the parser. The same log line sent to stderr goes to the client log or your terminal, which nobody parses as protocol.</desc>
  <style>
    .bg { fill: #f7f7f4; }
    .box { fill: #f7f7f4; stroke: #1a1a1e; stroke-width: 1.5; }
    .frame { fill: #f7f7f4; stroke: #2340a0; stroke-width: 1.25; }
    .frame-bad { fill: #f7f7f4; stroke: #c8372d; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .frame-log { fill: #f7f7f4; stroke: #d9d9d3; stroke-width: 1.25; }
    .soft-box { fill: none; stroke: #d9d9d3; stroke-width: 1.5; }
    .pipe { stroke: #2340a0; stroke-width: 2; fill: none; }
    .pipe-bad { stroke: #c8372d; stroke-width: 2; fill: none; }
    .pipe-err { stroke: #55565c; stroke-width: 2; fill: none; }
    .head { fill: #2340a0; }
    .head-bad { fill: #c8372d; }
    .head-err { fill: #55565c; }
    .h { font-family: "Schibsted Grotesk", sans-serif; font-size: 17px; font-weight: 700; fill: #1a1a1e; }
    .l { font-family: "Schibsted Grotesk", sans-serif; font-size: 15px; fill: #1a1a1e; }
    .s { font-family: "Schibsted Grotesk", sans-serif; font-size: 14px; fill: #55565c; }
    .pl { font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 600; fill: #2340a0; }
    .pl-err { font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 600; fill: #55565c; }
    .m { font-family: "IBM Plex Mono", monospace; font-size: 14px; fill: #1a1a1e; }
    .m-soft { font-family: "IBM Plex Mono", monospace; font-size: 14px; fill: #55565c; }
    .bad { font-family: "Schibsted Grotesk", sans-serif; font-size: 14px; font-weight: 700; fill: #c8372d; }
    .x { stroke: #c8372d; stroke-width: 2.5; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .bg, .box, .frame, .frame-bad, .frame-log { fill: #16171a; }
      .box { stroke: #e8e8e3; }
      .frame { stroke: #8aa2ff; }
      .frame-log, .soft-box { stroke: #34353a; }
      .pipe { stroke: #8aa2ff; }
      .pipe-err { stroke: #a3a4a9; }
      .head { fill: #8aa2ff; }
      .head-err { fill: #a3a4a9; }
      .h, .l, .m { fill: #e8e8e3; }
      .s, .m-soft, .pl-err { fill: #a3a4a9; }
      .pl { fill: #8aa2ff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-bad" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-err" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="440"/>

  <!-- Client -->
  <rect class="box" x="20" y="30" width="190" height="270" rx="6"/>
  <text class="h" x="115" y="62" text-anchor="middle">MCP client</text>
  <text class="s" x="115" y="84" text-anchor="middle">e.g. Claude Desktop</text>
  <text class="s" x="115" y="262" text-anchor="middle">parses every line</text>
  <text class="s" x="115" y="281" text-anchor="middle">as JSON-RPC</text>

  <!-- Server -->
  <rect class="box" x="590" y="30" width="190" height="270" rx="6"/>
  <text class="h" x="685" y="62" text-anchor="middle">Your MCP server</text>
  <text class="m-soft" x="685" y="84" text-anchor="middle">uv run my-mcp</text>
  <text class="s" x="685" y="262" text-anchor="middle">print(), structlog,</text>
  <text class="s" x="685" y="281" text-anchor="middle">chatty libraries</text>

  <!-- stdin: client to server -->
  <text class="pl" x="222" y="88">stdin</text>
  <line class="pipe" x1="212" y1="112" x2="586" y2="112" marker-end="url(#a)"/>
  <rect class="frame" x="293" y="99" width="214" height="26" rx="4"/>
  <text class="m" x="400" y="117" text-anchor="middle">{"method":"tools/list"}</text>

  <!-- stdout: server to client -->
  <text class="pl" x="536" y="160">stdout</text>
  <line class="pipe" x1="588" y1="184" x2="214" y2="184" marker-end="url(#a)"/>
  <rect class="frame" x="264" y="171" width="272" height="26" rx="4"/>
  <text class="m" x="400" y="189" text-anchor="middle">{"jsonrpc":"2.0","result":{…}}</text>

  <line class="pipe-bad" x1="588" y1="232" x2="250" y2="232" marker-end="url(#ab)"/>
  <rect class="frame-bad" x="262" y="219" width="297" height="26" rx="4"/>
  <text class="m" x="410" y="237" text-anchor="middle">{"event":"loaded","level":"info"}</text>
  <line class="x" x1="222" y1="222" x2="242" y2="242"/>
  <line class="x" x1="242" y1="222" x2="222" y2="242"/>
  <text class="bad" x="222" y="268">rejected: not JSON-RPC</text>

  <!-- stderr: server down to log -->
  <line class="pipe-err" x1="685" y1="302" x2="685" y2="350" marker-end="url(#ae)"/>
  <text class="pl-err" x="697" y="332">stderr</text>
  <rect class="soft-box" x="400" y="354" width="380" height="68" rx="6"/>
  <text class="l" x="590" y="380" text-anchor="middle">client log, or your terminal</text>
  <text class="m-soft" x="590" y="406" text-anchor="middle">{"event":"loaded","level":"info"}</text>

  <text class="s" x="20" y="380">The client never parses stderr,</text>
  <text class="s" x="20" y="400">so every log line belongs there.</text>
</svg>
